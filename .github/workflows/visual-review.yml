name: Remotion Visual Review

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ki/src/visual-system/**'
      - 'ki/src/reels/gpt-5-6-chatgpt/**'
      - 'ki/src/reels/gpt-5-5-retirement/**'
      - 'ki/src/longform/**'
      - 'ki/youtube-longform/**'
      - 'ki/gehirn/YOUTUBE_VISUAL_LANGUAGE.md'
      - 'ki/gehirn/APPROVED_KI_VISUALS.md'
      - 'ki/reels/2026-09-21_bis_2026-09-27/04_GPT-5-5-fliegt-aus-ChatGPT-raus/**'
      - 'scripts/render-visual-contact-sheet.mjs'
      - 'scripts/visual-contact-metrics.mjs'
      - 'scripts/visual-review-presets.mjs'
      - 'scripts/__tests__/visual-contact-metrics.test.mjs'
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remotion-visual-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_INSTALL_FLAGS: '--package-lock=false --legacy-peer-deps --no-audit --no-fund'

jobs:
  contact-sheet:
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: gpt56
            label: GPT-5.6
            report: ki/reels/2026-09-21_bis_2026-09-27/03_GPT-5-6-welches-ChatGPT-nutzt-du/05-export/visual-review/visual-review.json
            sheet: ki/reels/2026-09-21_bis_2026-09-27/03_GPT-5-6-welches-ChatGPT-nutzt-du/05-export/visual-review/contact-sheet.jpg
          - preset: gpt55
            label: GPT-5.5 retirement
            report: ki/reels/2026-09-21_bis_2026-09-27/04_GPT-5-5-fliegt-aus-ChatGPT-raus/05-export/visual-review/visual-review.json
            sheet: ki/reels/2026-09-21_bis_2026-09-27/04_GPT-5-5-fliegt-aus-ChatGPT-raus/05-export/visual-review/contact-sheet.jpg
          - preset: aiAppLongform
            label: AI App Workflow Longform
            report: ki/youtube-longform/2026-08-16/01_Mit-KI-eine-App-bauen/05-export/visual-review/visual-review.json
            sheet: ki/youtube-longform/2026-08-16/01_Mit-KI-eine-App-bauen/05-export/visual-review/contact-sheet.jpg
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install canonical workspaces
        run: npm install $NPM_INSTALL_FLAGS

      - name: Verify visual metrics
        run: node --test scripts/__tests__/visual-contact-metrics.test.mjs

      - name: Render ${{ matrix.label }} visual contact sheet
        run: node scripts/render-visual-contact-sheet.mjs --preset=${{ matrix.preset }}

      - name: Print visual review metrics
        run: cat '${{ matrix.report }}'

      - name: Upload visual review artifact when storage is available
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}-remotion-visual-review
          path: |
            ${{ matrix.sheet }}
            ${{ matrix.report }}
          if-no-files-found: error
