name: Content Matching PR Checks

on:
  push:
    branches:
      - fix/content-matched-animation-selection
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-animation-library:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --workspaces=false --package-lock=false --no-audit --no-fund

      - name: Verify animation library
        run: npm run animation-library:verify

      - name: Run content-matching regression tests explicitly
        run: >-
          npx --no-install vitest run
          ki/src/animation-library/__tests__/contentMatching.test.ts
          ki/src/animation-library/__tests__/stableContentMatchedPlanner.test.ts
          ki/src/animation-library/__tests__/extendedMeaningContract.test.ts
