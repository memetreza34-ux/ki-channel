name: Physical AI Art Direction Lab

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ki/gehirn/ART_DIRECTION.md'
      - 'ki/gehirn/ART_DIRECTION_CALIBRATION_TEMPLATE.json'
      - 'ki/src/art-direction/**'
      - 'ki/src/visual-system/channelArtDirection.ts'
      - 'ki/src/Root.tsx'
      - 'scripts/channel-art-direction-contract.mjs'
      - 'scripts/check-channel-art-direction.mjs'
      - 'scripts/__tests__/channel-art-direction-contract.test.mjs'
      - '.github/workflows/art-direction-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: art-direction-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install canonical workspaces
        run: npm install --package-lock=false --legacy-peer-deps --no-audit --no-fund

      - name: Validate art-direction contract
        run: |
          node --test scripts/__tests__/channel-art-direction-contract.test.mjs
          node scripts/check-channel-art-direction.mjs
          node scripts/check-production-visual-contracts.mjs
          npm run typecheck:motion

      - name: Render calibration stills
        run: |
          mkdir -p out/art-direction-lab
          npx --no-install remotion still ki/src/index.ts KI-ArtDirection-PhysicalAIWorld-V1 out/art-direction-lab/01-hook.png --frame=90
          npx --no-install remotion still ki/src/index.ts KI-ArtDirection-PhysicalAIWorld-V1 out/art-direction-lab/02-mechanism.png --frame=270
          npx --no-install remotion still ki/src/index.ts KI-ArtDirection-PhysicalAIWorld-V1 out/art-direction-lab/03-payoff.png --frame=450

      - name: Render motion calibration video
        run: npx --no-install remotion render ki/src/index.ts KI-ArtDirection-PhysicalAIWorld-V1 out/art-direction-lab/physical-ai-world-v1.mp4 --scale=0.5

      - name: Upload art-direction review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-ai-art-direction-lab
          path: out/art-direction-lab/
          if-no-files-found: warn
