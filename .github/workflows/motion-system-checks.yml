name: Repository and Content System Checks

# GitHub Actions for this private repository is currently blocked before Step 1
# by the account's Actions billing/spending state. Keep this workflow manual until
# the runner is available again. The commands below are the canonical repository
# and content-release gates and can also be run locally.
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Content-Prüftiefe'
        required: true
        default: 'verify'
        type: choice
        options:
          - verify
          - smoke
          - full

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare diagnostics
        run: mkdir -p ci-logs

      - name: Record environment
        if: always()
        run: |
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "pwd=$(pwd)"
            echo "head=$(git rev-parse HEAD)"
            echo "release_mode=${{ inputs.release_mode }}"
          } | tee ci-logs/environment.log

      - name: Install canonical workspaces
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --package-lock=false --no-audit --no-fund 2>&1 | tee ci-logs/install.log

      - name: Verify workspace wiring
        id: workspaces
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee ci-logs/workspaces.log
          const fs = require('node:fs');
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const core = JSON.parse(fs.readFileSync('core/package.json', 'utf8'));
          const ki = JSON.parse(fs.readFileSync('ki/package.json', 'utf8'));
          const expected = ['core', 'ki'];
          if (JSON.stringify(root.workspaces) !== JSON.stringify(expected)) {
            throw new Error(`Root workspaces must be ${expected.join(', ')}`);
          }
          if (core.name !== '@studio/core') {
            throw new Error('core/package.json must expose @studio/core');
          }
          if (ki.name !== '@studio/ki' || !ki.dependencies?.['@studio/core']) {
            throw new Error('ki/package.json must depend on @studio/core');
          }
          console.log('Workspace wiring is canonical: core -> @studio/core, ki -> @studio/ki.');
          NODE

      - name: Validate reel package structure
        id: structure
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run ki:reel:structure-check 2>&1 | tee ci-logs/reel-structure.log

      - name: Verify motion system
        id: motion_verify
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run motion:verify 2>&1 | tee ci-logs/motion-verify.log

      - name: Run canonical content release mode
        id: content_release
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run "release:${{ inputs.release_mode }}" 2>&1 | tee ci-logs/content-release.log

      - name: Upload release summary and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-release-${{ inputs.release_mode }}-diagnostics
          path: |
            ci-logs/
            out/content-release-run/
            out/content-matched/runtime-verification/
          if-no-files-found: warn

      - name: Upload smoke/full review artifacts
        if: always() && (inputs.release_mode == 'smoke' || inputs.release_mode == 'full')
        uses: actions/upload-artifact@v4
        with:
          name: content-release-${{ inputs.release_mode }}-review
          path: |
            out/masterplan-content-release/
            out/content-motion-edge-cases/
            out/content-review-gallery/
          if-no-files-found: warn

      - name: Upload full animation library artifacts
        if: always() && inputs.release_mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: content-release-full-animation-library
          path: out/animation-library/
          if-no-files-found: warn

      - name: Fail when verification failed
        if: >-
          always() &&
          (
            steps.install.outcome == 'failure' ||
            steps.workspaces.outcome == 'failure' ||
            steps.structure.outcome == 'failure' ||
            steps.motion_verify.outcome == 'failure' ||
            steps.content_release.outcome == 'failure'
          )
        run: exit 1
