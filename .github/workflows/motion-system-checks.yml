name: Motion System Checks

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: alles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare diagnostics
        run: mkdir -p ci-logs
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --workspaces=false --package-lock=false --no-audit --no-fund
      - name: Run focused motion verification
        id: verify
        if: always()
        continue-on-error: true
        run: npm run motion:verify
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-verification-diagnostics
          path: alles/ci-logs/
          if-no-files-found: warn
      - name: Fail when verification failed
        if: always() && (steps.install.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: exit 1

  smoke-render:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: alles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --workspaces=false --package-lock=false --no-audit --no-fund
      - name: Render smoke frames
        env:
          MOTION_CONCURRENCY: '2'
        run: npm run motion:smoke
      - name: Upload smoke renders
        uses: actions/upload-artifact@v4
        with:
          name: motion-smoke-renders
          path: alles/out/motion-system/
          if-no-files-found: error
