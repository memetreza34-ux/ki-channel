name: Repository and Content System Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ki/**'
      - 'scripts/**'
      - 'package.json'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - 'AGENTS.md'
      - 'REPO-STATE.md'
      - 'README.md'
      - '.github/workflows/motion-system-checks.yml'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Content-Prüftiefe'
        required: true
        default: 'verify'
        type: choice
        options:
          - verify
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: repository-content-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_INSTALL_FLAGS: '--package-lock=false --legacy-peer-deps --no-audit --no-fund'

jobs:
  pull-request-verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install canonical workspaces without writing a lockfile
        run: npm install $NPM_INSTALL_FLAGS

      - name: Repository, TypeScript, tests and runtime gates
        run: npm run repo:verify

  manual-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RELEASE_MODE: ${{ inputs.release_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare diagnostics
        run: mkdir -p ci-logs

      - name: Record environment
        if: always()
        run: |
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "pwd=$(pwd)"
            echo "head=$(git rev-parse HEAD)"
            echo "release_mode=${RELEASE_MODE}"
            echo "npm_install_flags=${NPM_INSTALL_FLAGS}"
          } | tee ci-logs/environment.log

      - name: Verify repository wiring before install
        id: wiring
        continue-on-error: true
        run: |
          set -o pipefail
          npm run repo:wiring-check 2>&1 | tee ci-logs/repository-wiring.log

      - name: Install canonical workspaces
        id: install
        if: always() && steps.wiring.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm install $NPM_INSTALL_FLAGS 2>&1 | tee ci-logs/install.log

      - name: Validate reel package structure
        id: structure
        if: always() && steps.wiring.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run ki:reel:structure-check 2>&1 | tee ci-logs/reel-structure.log

      - name: Verify motion system
        id: motion_verify
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run motion:verify 2>&1 | tee ci-logs/motion-verify.log

      - name: Run canonical content release mode
        id: content_release
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run "release:${RELEASE_MODE}" 2>&1 | tee ci-logs/content-release.log

      - name: Upload release summary and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-release-${{ inputs.release_mode }}-diagnostics
          path: |
            ci-logs/
            out/content-release-run/
            out/content-matched/runtime-verification/
          if-no-files-found: warn

      - name: Upload smoke/full review artifacts
        if: always() && (inputs.release_mode == 'smoke' || inputs.release_mode == 'full')
        uses: actions/upload-artifact@v4
        with:
          name: content-release-${{ inputs.release_mode }}-review
          path: |
            out/masterplan-content-release/
            out/content-motion-edge-cases/
            out/creative-recipes/
            out/content-review-gallery/
          if-no-files-found: warn

      - name: Upload full animation library artifacts
        if: always() && inputs.release_mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: content-release-full-animation-library
          path: out/animation-library/
          if-no-files-found: warn

      - name: Fail when verification failed
        if: >-
          always() &&
          (
            steps.wiring.outcome == 'failure' ||
            steps.install.outcome == 'failure' ||
            steps.structure.outcome == 'failure' ||
            steps.motion_verify.outcome == 'failure' ||
            steps.content_release.outcome == 'failure'
          )
        run: exit 1
