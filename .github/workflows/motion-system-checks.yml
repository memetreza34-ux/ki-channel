name: Repository and Content System Checks

# GitHub Actions for this private repository is currently blocked before Step 1
# by the account's Actions billing/spending state. Keep this workflow manual until
# the runner is available again. The commands below mirror the canonical local
# production and release gates.
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Content-Prüftiefe'
        required: true
        default: 'verify'
        type: choice
        options:
          - verify
          - smoke
          - full

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare diagnostics
        run: mkdir -p ci-logs

      - name: Record environment
        if: always()
        run: |
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "pwd=$(pwd)"
            echo "head=$(git rev-parse HEAD)"
            echo "release_mode=${{ inputs.release_mode }}"
          } | tee ci-logs/environment.log

      - name: Verify repository wiring before install
        id: wiring
        continue-on-error: true
        run: |
          set -o pipefail
          npm run repo:wiring-check 2>&1 | tee ci-logs/repository-wiring.log

      - name: Verify production contracts before install
        id: contracts
        if: always() && steps.wiring.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            npm run production:contracts
            node ki/scripts/validate-script-budget-contract.mjs
          } 2>&1 | tee ci-logs/production-contracts.log

      - name: Verify Longform v1 contracts before install
        id: longform_contracts
        if: always() && steps.wiring.outcome == 'success' && steps.contracts.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node --check scripts/new-ki-longform.mjs
            node --check scripts/check-ki-longform-structure.mjs
            node --check scripts/check-ki-longform-release.mjs
            node --check scripts/prepare-longform-video-asset.mjs
            node --check scripts/__tests__/longform-v1-contracts.test.mjs
            node scripts/check-ki-longform-structure.mjs
            node --test scripts/__tests__/longform-v1-contracts.test.mjs
          } 2>&1 | tee ci-logs/longform-contracts.log

      - name: Install canonical workspaces
        id: install
        if: always() && steps.wiring.outcome == 'success' && steps.contracts.outcome == 'success' && steps.longform_contracts.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --package-lock=false --no-audit --no-fund 2>&1 | tee ci-logs/install.log

      - name: Run canonical repository verification
        id: repo_verify
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run repo:verify 2>&1 | tee ci-logs/repo-verify.log

      - name: Verify motion system
        id: motion_verify
        if: always() && steps.repo_verify.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run motion:verify 2>&1 | tee ci-logs/motion-verify.log

      - name: Run canonical content release mode
        id: content_release
        if: always() && steps.motion_verify.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run "release:${{ inputs.release_mode }}" 2>&1 | tee ci-logs/content-release.log

      - name: Upload release summary and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-release-${{ inputs.release_mode }}-diagnostics
          path: |
            ci-logs/
            out/content-release-run/
            out/content-matched/runtime-verification/
          if-no-files-found: warn

      - name: Upload smoke/full review artifacts
        if: always() && (inputs.release_mode == 'smoke' || inputs.release_mode == 'full')
        uses: actions/upload-artifact@v4
        with:
          name: content-release-${{ inputs.release_mode }}-review
          path: |
            out/masterplan-content-release/
            out/content-motion-edge-cases/
            out/content-review-gallery/
          if-no-files-found: warn

      - name: Upload full animation library artifacts
        if: always() && inputs.release_mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: content-release-full-animation-library
          path: out/animation-library/
          if-no-files-found: warn

      - name: Fail when verification failed
        if: >-
          always() &&
          (
            steps.wiring.outcome == 'failure' ||
            steps.contracts.outcome == 'failure' ||
            steps.longform_contracts.outcome == 'failure' ||
            steps.install.outcome == 'failure' ||
            steps.repo_verify.outcome == 'failure' ||
            steps.motion_verify.outcome == 'failure' ||
            steps.content_release.outcome == 'failure'
          )
        run: exit 1
