name: First Real Reel - Token Slicer

on:
  pull_request:
    branches: [main]
    paths:
      - 'ki/src/reels/token-slicer/**'
      - 'ki/src/ProductionRoot.tsx'
      - 'ki/src/productionRootIsolation.test.ts'
      - 'scripts/check-production-visual-contracts.mjs'
      - 'ki/reels/2026-09-21_bis_2026-09-27/01_Warum-KI-Woerter-zerlegt/01-script-audio/**'
      - 'ki/reels/2026-09-21_bis_2026-09-27/01_Warum-KI-Woerter-zerlegt/02-bilder/**'
      - 'ki/reels/2026-09-21_bis_2026-09-27/01_Warum-KI-Woerter-zerlegt/03-caption/**'
      - 'ki/reels/2026-09-21_bis_2026-09-27/01_Warum-KI-Woerter-zerlegt/06-projektdateien/**'
      - '.github/workflows/token-slicer-real-reel-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-token-slicer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NPM_INSTALL_FLAGS: --package-lock=false --legacy-peer-deps --no-audit --no-fund
      REEL_ROOT: ki/reels/2026-09-21_bis_2026-09-27/01_Warum-KI-Woerter-zerlegt
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install canonical workspaces
        run: npm install $NPM_INSTALL_FLAGS

      - name: Token Slicer focused typecheck and test
        run: |
          npm run typecheck:motion
          npx --no-install vitest run ki/src/reels/token-slicer/tokenSlicerContract.test.ts ki/src/productionRootIsolation.test.ts
          node scripts/check-production-visual-contracts.mjs
          npm run ki:reel:structure-check

      - name: Materialize generated voiceover
        run: |
          mkdir -p public out/first-real-reel "$REEL_ROOT/01-script-audio" "$REEL_ROOT/05-export"
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/56f288df-5d80-40aa-ac40-e64cb37fce80.mp3' -o /tmp/token-slicer-voice-a.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/da0e902e-8323-4b78-b98f-291e489ad40d.mp3' -o /tmp/token-slicer-voice-b.mp3
          REMOTION_FFMPEG='./node_modules/@remotion/compositor-linux-x64-gnu/ffmpeg'
          REMOTION_FFPROBE='./node_modules/@remotion/compositor-linux-x64-gnu/ffprobe'
          "$REMOTION_FFMPEG" -hide_banner -loglevel error -y \
            -i /tmp/token-slicer-voice-a.mp3 \
            -i /tmp/token-slicer-voice-b.mp3 \
            -filter_complex '[0:a][1:a]concat=n=2:v=0:a=1[a]' \
            -map '[a]' -c:a libmp3lame -q:a 2 \
            public/token-slicer-voiceover.mp3
          cp public/token-slicer-voiceover.mp3 "$REEL_ROOT/01-script-audio/voiceover.mp3"
          "$REMOTION_FFPROBE" -v error -show_entries format=duration -of default=nw=1:nk=1 public/token-slicer-voiceover.mp3 | tee out/first-real-reel/voiceover-duration.txt

      - name: Render real reel with generated voiceover
        run: |
          python3 -m http.server 8765 --directory public >/tmp/token-slicer-audio-server.log 2>&1 &
          AUDIO_SERVER_PID=$!
          trap 'kill "$AUDIO_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsI 'http://127.0.0.1:8765/token-slicer-voiceover.mp3' >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsI 'http://127.0.0.1:8765/token-slicer-voiceover.mp3' >/dev/null
          npx --no-install remotion render \
            ki/src/production-entry.tsx \
            TokenSlicerReel \
            out/first-real-reel/token-slicer.mp4 \
            --props='{"showCaptions":true,"voiceoverSrc":"http://127.0.0.1:8765/token-slicer-voiceover.mp3"}' \
            --codec=h264 \
            --crf=18
          test -s out/first-real-reel/token-slicer.mp4
          cp out/first-real-reel/token-slicer.mp4 "$REEL_ROOT/05-export/token-slicer.mp4"
          cp out/first-real-reel/voiceover-duration.txt "$REEL_ROOT/05-export/voiceover-duration.txt"
          ls -lh "$REEL_ROOT/05-export/token-slicer.mp4"

      - name: Persist real Phase-2/3 media on PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REEL_ROOT/01-script-audio/voiceover.mp3" "$REEL_ROOT/05-export/token-slicer.mp4" "$REEL_ROOT/05-export/voiceover-duration.txt"
          if git diff --cached --quiet; then
            echo 'Rendered media already persisted.'
          else
            git commit -m 'feat(reel): persist first real token slicer render [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
